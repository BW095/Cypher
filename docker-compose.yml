name: cypher

# Cypher — industrial AI brain (cloud deployment). Four services: the vector DB
# (Qdrant), the graph DB (Neo4j), the FastAPI backend (Bedrock LLM), and the
# nginx-served React UI.
#
# Prerequisites:
#   - AWS credentials (IAM role on EC2, or access keys in .env)
#   - Bedrock model access enabled (Claude 3.5 Haiku + Titan Embed v2)
#   - a .env file (copy from .env.cloud.example)

services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    # Memory limit — safe on t3.small. Remove if using t3.medium+.
    deploy:
      resources:
        limits:
          memory: 512m

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-please-change-me}"
      NEO4J_PLUGINS: '["apoc"]'
      # Heap limits — critical on 2GB instances
      NEO4J_server_memory_heap_initial__size: "256m"
      NEO4J_server_memory_heap_max__size: "512m"
      NEO4J_server_memory_pagecache__size: "256m"
    volumes:
      - neo4j_data:/data
    deploy:
      resources:
        limits:
          memory: 900m

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      - qdrant
      - neo4j
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      NEO4J_URI: "neo4j://neo4j:7687"
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-please-change-me}"
      SQLITE_DB_PATH: /data/app.db
      UPLOAD_DIR: /data/uploads
      # Amazon Bedrock
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      BEDROCK_CHAT_MODEL_ID: "${BEDROCK_CHAT_MODEL_ID:-}"
      BEDROCK_EXTRACTION_MODEL_ID: "${BEDROCK_EXTRACTION_MODEL_ID:-}"
      BEDROCK_EMBED_MODEL_ID: "${BEDROCK_EMBED_MODEL_ID:-}"
      CORS_ORIGINS: "http://localhost:${WEB_PORT:-8080}"
    volumes:
      # Documents to ingest. Track subfolders of /documents in the UI.
      - ${DOCUMENTS_DIR:-./documents}:/documents
      - backend_data:/data

  frontend:
    build:
      context: .
      dockerfile: ui/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  qdrant_data:
  neo4j_data:
  backend_data:
