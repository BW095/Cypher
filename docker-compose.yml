name: cypher

# Cypher — industrial AI brain (cloud deployment). Four services: the vector DB
# (Qdrant), the graph DB (Neo4j), the FastAPI backend (Bedrock LLM), and the
# nginx-served React UI.
#
# Prerequisites:
#   - AWS credentials (IAM role on EC2, or access keys in .env)
#   - Bedrock model access enabled (Nova Pro + Titan Embed v2)
#   - a .env file (copy from .env.cloud.example)

services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-please-change-me}"
    volumes:
      - neo4j_data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      - qdrant
      - neo4j
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-please-change-me}"
      SQLITE_DB_PATH: /data/app.db
      UPLOAD_DIR: /data/uploads
      # Amazon Bedrock — leave blank to use IAM role on EC2 (recommended).
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      # Model IDs — only pass if set in .env; otherwise Python config defaults apply.
      # This avoids passing empty strings that override the Python-level defaults.
      BEDROCK_CHAT_MODEL_ID: "${BEDROCK_CHAT_MODEL_ID:-us.amazon.nova-pro-v1:0}"
      BEDROCK_EXTRACTION_MODEL_ID: "${BEDROCK_EXTRACTION_MODEL_ID:-us.amazon.nova-lite-v1:0}"
      BEDROCK_EMBED_MODEL_ID: "${BEDROCK_EMBED_MODEL_ID:-amazon.titan-embed-text-v2:0}"
      CORS_ORIGINS: "*"
    volumes:
      - ${DOCUMENTS_DIR:-./documents}:/documents
      - backend_data:/data

  frontend:
    build:
      context: .
      dockerfile: ui/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  qdrant_data:
  neo4j_data:
  backend_data:
