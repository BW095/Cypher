name: cypher

# Cypher — industrial AI brain (cloud deployment). Four services: the vector DB
# (Qdrant), the graph DB (Neo4j), the FastAPI backend (Bedrock LLM), and the
# nginx-served React UI.
#
# Prerequisites:
#   - AWS credentials (IAM role on EC2, or access keys in .env)
#   - Bedrock model access enabled (Nova Pro + Titan Embed v2)
#   - a .env file (copy from .env.cloud.example)

services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-please-change-me}"
    volumes:
      - neo4j_data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      - qdrant
      - neo4j
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-please-change-me}"
      SQLITE_DB_PATH: /data/app.db
      UPLOAD_DIR: /data/uploads
      # Bedrock Mantle (OpenAI-compatible API)
      MANTLE_API_KEY: "${MANTLE_API_KEY}"
      MANTLE_BASE_URL: "${MANTLE_BASE_URL:-https://bedrock-mantle.us-east-1.api.aws/v1}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      # Model IDs for Mantle
      BEDROCK_CHAT_MODEL_ID: "${BEDROCK_CHAT_MODEL_ID:-qwen.qwen3-32b-v1:0}"
      BEDROCK_EXTRACTION_MODEL_ID: "${BEDROCK_EXTRACTION_MODEL_ID:-google.gemma-3-12b-it}"
      # Local embedding model (no API needed)
      LOCAL_EMBED_MODEL: "${LOCAL_EMBED_MODEL:-all-MiniLM-L6-v2}"
      VECTOR_SIZE: "${VECTOR_SIZE:-384}"
      CORS_ORIGINS: "*"
    volumes:
      - ${DOCUMENTS_DIR:-./documents}:/documents
      - backend_data:/data

  frontend:
    build:
      context: .
      dockerfile: ui/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  qdrant_data:
  neo4j_data:
  backend_data:
